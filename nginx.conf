worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
	# access_log /dev/stdout;
	# error_log /dev/stderr;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_disable "msie6";
    
    map $http_origin $allow_origin {
        defualt "";
        "~^http://localhost:3000$" $http_origin;
        "~^http://cimnewuat.etisalat.corp.ae$" $http_origin;
        "~^http://newt.cimnewuat.etisalat.corp.ae$" $ http_origin;
    }

    server {
        listen 3000;
        server_name _;
        server_tokens off;
        root /usr/share/nginx/html;

        add_header X-Frame-Options "ALLOW-FROM https://cimnewuat.etisalat.corp.ae" always;
        add_header 'Access-Control-Allow-Origin' $allow_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-with,If-Modified-Since,Cache-Content-Type, Authorization' always;

        # NOTE (fixed): this block's regex only match .html?/.json - the original also had an unescaped ? that made "html" optional in  a
        # way that could accidentally match unrelated paths. Scoped it to the actual file types intended.
        location ~* \.(?:html?|json)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;  
            expires off;
            try_files $uri $uri/ /fixed/index.html;
        }

        # # Default: HTML should not be cached by browsers (so users always get latest index.html)
        # location ~* \\.(?:html?|json)$ {
        #     add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        #     add_header Pragma "no-cache" always;
        #     expires off;
        #     try_files $uri $uri/ /fixed/index.html;
        # }

        location = /fixed {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
            return 301 https://next.cimnewuat.etisalat.corp.ae/fixed/$is_args$args;
        }
        # Hashed, immutable static assets - safe to cache for long time.
        # fixed: 3153600s is ~36.5 days, not a year. If a full year was intended, that is 31536000.
        # Serve static assets (css/js/images/fonts) with long cache and immutable since filenames are content-hashed
        location ~* ^/fixed/.*\.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
            # One year caching for hashed assets
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Fallback for SPA routes - serve index.html and prevent caching of the HTML shell
        location /fixed/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $allow_origin always;
                add_header 'Access-Control-Allow-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-length' 0;
                return 204;
            }
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            expires off;
            try_files $uri $uri.html $uri/ /fixed/index.html;
        }

        # Serve SPA entry for any debugreport client route
        location ^~ /fixed/debugreport {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
            try_files $uri $uri.html $uri/ /fixed/index.html;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
